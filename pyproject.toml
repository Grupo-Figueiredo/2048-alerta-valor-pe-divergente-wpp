[project]
name = "alerta-valor-pe-divergente-wpp"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "isort>=6.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N818"]

[tool.ruff.format]
quote-style = "double"

[tool.isort]
profile = "black"
line_length = 120
