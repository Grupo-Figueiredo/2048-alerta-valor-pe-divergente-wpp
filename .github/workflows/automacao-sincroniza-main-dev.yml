name: back-merge-main-dev

# Apos qualquer push na main (merge de release/*|fix/hotfix-* -> main, sempre
# merge commit real - nunca squash, ver ruleset protect-main), a dev ainda nao
# tem esse commit como ancestral: o merge para a main so anexa o commit la,
# nao empurra a dev junto. Este job faz o back-merge automatico main->dev.
#
# Quando o merge nao resolve sozinho - a release/* recebeu correcao que a dev
# nunca viu (ex.: ajuste pedido em revisao aplicado direto na release/* pra
# nao abrir outro PR) - este job resolve automaticamente a favor da main: ela
# ja passou por aprovacao/CI, e a fonte de verdade. Nunca aborta pedindo
# intervencao manual.
#
# Cobre so a dev: a release/* efemera ja e apagada ao virar main, entao
# nao ha branch de homolog permanente para sincronizar (fase 2 concluida -
# o Environment de homolog agora e o `release`, sem branch fixa).
#
# O merge do PR usa secrets.GH_TOKEN (PAT do Admin), nao o GITHUB_TOKEN
# padrao: o ruleset protect-dev (provisionado por ServicoRulesetGitHub)
# exige aprovacao via bypass_actors de role Admin, e o bot "github-actions"
# nao entraria na lista de bypass - so um papel humano entraria. Com o PAT,
# o merge e atribuido a esse humano e passa.
on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: back-merge-main-dev
  cancel-in-progress: false

jobs:
  back-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Back-merge main -> dev (merge commit real, nunca squash)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git fetch origin main dev

          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev ja contem a main, nada a fazer."
            exit 0
          fi

          git config user.name "back-merge-bot"
          git config user.email "actions@github.com"

          BRANCH="chore/back-merge-main-$(git rev-parse --short origin/main)"
          git checkout -b "$BRANCH" origin/dev

          # Tenta o merge normal; se conflitar, resolve a favor da main (fonte
          # ja aprovada/testada) em vez de abortar e pedir ajuda manual. Nao
          # confia em "sem conflito reportado" = correto: um merge automatico
          # "limpo" ja reintroduziu em producao uma env var que a main tinha
          # removido (os dois lados tocaram linhas proximas sem overlap
          # direto - git nao viu isso como conflito). Por isso, alem de
          # resolver os conflitos que aparecerem, forca a versao da main em
          # TODO arquivo que ela alterou desde a base comum com a dev.
          git merge --no-commit --no-ff origin/main || true

          git diff --name-only origin/dev origin/main | while IFS= read -r arquivo; do
            if git cat-file -e "origin/main:$arquivo" 2>/dev/null; then
              git checkout origin/main -- "$arquivo"
            else
              git rm -f --ignore-unmatch -- "$arquivo"
            fi
          done

          git add -A
          git commit --no-edit

          git push origin "$BRANCH"
          gh pr create --base dev --head "$BRANCH" \
            --title "chore: sincroniza dev com main via back-merge automatico" \
            --body "Back-merge automatico apos push em main. Arquivos que a main alterou levam a versao dela - fonte ja aprovada/testada."
          gh pr merge "$BRANCH" --merge --delete-branch
